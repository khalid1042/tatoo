<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B10"/>
      <stop offset="50%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#07080D"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="300" cy="200" r="220" fill="url(#glow)"/>

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="560" height="360" rx="16" fill="none" stroke="#EC4899" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- Style Tag -->
  <rect x="200" y="38" width="200" height="26" rx="13" fill="#1E1B4B" stroke="#EC4899" stroke-opacity="0.6"/>
  <text x="300" y="55" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#EC4899" text-anchor="middle" letter-spacing="2">
    FINE LINE EGYPTIAN
  </text>

  <!-- Main Title -->
  <text x="300" y="115" font-family="'Cinzel', Georgia, serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    Goddess Isis
  </text>

  <text x="300" y="140" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Under-Bust Sternum Wings
  </text>

  <!-- Decorative Tattoo Flash Box -->
  <rect x="80" y="165" width="440" height="150" rx="12" fill="#0B0E14" stroke="#334155" stroke-width="1.5"/>

  <!-- Tattoo Content Lines -->
  
    <text x="300" y="205" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      𓋹 GODDESS ISIS 𓋹
    </text>
  
    <text x="300" y="237" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#EC4899" text-anchor="middle" letter-spacing="1.5">
      OUTSTRETCHED WINGS
    </text>
  
    <text x="300" y="269" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#EC4899" text-anchor="middle" letter-spacing="1.5">
      CLARA TRIBUTE
    </text>
  

  <!-- Footer Watermark -->
  <text x="300" y="355" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">
    TATTOO FONTLAB • FAMOUS DESIGNS ARCHIVE
  </text>
</svg>