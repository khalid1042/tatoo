<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-om" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0A06"/>
      <stop offset="50%" stop-color="#21150A"/>
      <stop offset="100%" stop-color="#0A0704"/>
    </linearGradient>
    <radialGradient id="glow-om" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg-om)"/>
  <circle cx="300" cy="200" r="230" fill="url(#glow-om)"/>

  <rect x="20" y="20" width="560" height="360" rx="16" fill="none" stroke="#F97316" stroke-opacity="0.3" stroke-width="2"/>

  <rect x="180" y="32" width="240" height="26" rx="13" fill="#7C2D12" stroke="#F97316" stroke-opacity="0.6"/>
  <text x="300" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFEDD5" text-anchor="middle" letter-spacing="2">
    SACRED SANSKRIT CALLIGRAPHY
  </text>

  <text x="300" y="98" font-family="Georgia, serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    Sacred Sanskrit Om Mantra
  </text>
  <text x="300" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Devanagari Peace Glyph &amp; Universal Sound
  </text>

  <!-- Sanskrit Artwork Box -->
  <g transform="translate(100, 160)">
    <rect width="400" height="150" rx="16" fill="#0B0E14" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Central Om Glyph ॐ -->
    <text x="200" y="95" font-family="'Devanagari', Georgia, serif" font-size="70" font-weight="900" fill="#F97316" text-anchor="middle">
      ॐ
    </text>

    <text x="200" y="128" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FB923C" letter-spacing="3" text-anchor="middle">
      LOKAH SAMASTAH SUKHINO BHAVANTU
    </text>
  </g>

  <text x="300" y="372" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">
    TATTOO FONTLAB • FAMOUS DESIGNS ARCHIVE
  </text>
</svg>