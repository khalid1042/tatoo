<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-goth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#12101A"/>
      <stop offset="100%" stop-color="#040406"/>
    </linearGradient>
    <radialGradient id="glow-goth" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg-goth)"/>
  <circle cx="300" cy="200" r="230" fill="url(#glow-goth)"/>

  <rect x="20" y="20" width="560" height="360" rx="16" fill="none" stroke="#A855F7" stroke-opacity="0.3" stroke-width="2"/>

  <rect x="180" y="32" width="240" height="26" rx="13" fill="#3B0764" stroke="#A855F7" stroke-opacity="0.6"/>
  <text x="300" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#F3E8FF" text-anchor="middle" letter-spacing="2">
    GOTHIC BLACKLETTER SCRIPT
  </text>

  <text x="300" y="98" font-family="Georgia, serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    Old English Surname Backpiece
  </text>
  <text x="300" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Classic Urban Back Arc Lettering
  </text>

  <!-- Gothic Lettering Graphic Box -->
  <g transform="translate(60, 160)">
    <rect width="480" height="150" rx="16" fill="#0B0E14" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Filigree Diamond Accents -->
    <polygon points="240,25 248,35 240,45 232,35" fill="#A855F7"/>
    <line x1="120" y1="35" x2="220" y2="35" stroke="#A855F7" stroke-width="1" opacity="0.6"/>
    <line x1="260" y1="35" x2="360" y2="35" stroke="#A855F7" stroke-width="1" opacity="0.6"/>

    <!-- Arched Gothic Blackletter Text -->
    <text x="240" y="96" font-family="'UnifrakturMaguntia', 'Cinzel', serif" font-size="44" font-weight="900" fill="#F8FAFC" letter-spacing="6" text-anchor="middle" stroke="#A855F7" stroke-width="0.5">
      𝕶𝕺𝕹𝕲𝕾𝕭𝕰𝕽𝕄
    </text>

    <text x="240" y="126" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#C084FC" letter-spacing="4" text-anchor="middle">
      ESTABLISHED MCMXCVII
    </text>
  </g>

  <text x="300" y="372" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">
    TATTOO FONTLAB • FAMOUS DESIGNS ARCHIVE
  </text>
</svg>