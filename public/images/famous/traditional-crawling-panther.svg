<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-panther" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0909"/>
      <stop offset="50%" stop-color="#211111"/>
      <stop offset="100%" stop-color="#0A0606"/>
    </linearGradient>
    <radialGradient id="glow-panther" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg-panther)"/>
  <circle cx="300" cy="200" r="230" fill="url(#glow-panther)"/>

  <rect x="20" y="20" width="560" height="360" rx="16" fill="none" stroke="#EF4444" stroke-opacity="0.3" stroke-width="2"/>

  <rect x="180" y="32" width="240" height="26" rx="13" fill="#7F1D1D" stroke="#EF4444" stroke-opacity="0.6"/>
  <text x="300" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FEE2E2" text-anchor="middle" letter-spacing="2">
    AMERICAN TRADITIONAL FLASH
  </text>

  <text x="300" y="98" font-family="Georgia, serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    Classic Crawling Panther
  </text>
  <text x="300" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Bold Black Line &amp; Snarling Jaw Motif
  </text>

  <!-- Crawling Panther Graphic -->
  <g transform="translate(300, 240)">
    <!-- Panther Body Silhouette -->
    <path d="M -120 20 Q -60 -40 20 -20 Q 80 -30 110 -60 C 110 -60 90 20 20 30 Q -60 40 -120 20 Z" fill="#18181B" stroke="#000000" stroke-width="4"/>
    
    <!-- Red Claws Scratching -->
    <path d="M 100 -70 L 120 -85 M 105 -65 L 128 -78 M 110 -60 L 132 -70" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>

    <!-- Snarling Jaw & Teeth -->
    <circle cx="100" cy="-60" r="16" fill="#DC2626"/>
    <path d="M 95 -68 L 100 -58 L 105 -68 Z" fill="#FFFFFF"/>
    <path d="M 95 -52 L 100 -62 L 105 -52 Z" fill="#FFFFFF"/>

    <!-- Snarling Yellow Eye -->
    <ellipse cx="85" cy="-70" rx="4" ry="6" fill="#FACC15"/>
    <ellipse cx="85" cy="-70" rx="1.5" ry="5" fill="#000000"/>

    <!-- Muscle Skin Breaks -->
    <path d="M -40 -10 Q 0 -25 40 0" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  </g>

  <text x="300" y="372" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">
    TATTOO FONTLAB • FAMOUS DESIGNS ARCHIVE
  </text>
</svg>