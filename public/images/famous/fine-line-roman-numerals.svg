<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-roman" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B10"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#08090E"/>
    </linearGradient>
    <radialGradient id="glow-roman" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg-roman)"/>
  <circle cx="300" cy="200" r="220" fill="url(#glow-roman)"/>

  <rect x="20" y="20" width="560" height="360" rx="16" fill="none" stroke="#A855F7" stroke-opacity="0.3" stroke-width="2"/>

  <rect x="190" y="36" width="220" height="26" rx="13" fill="#2E1065" stroke="#C084FC" stroke-opacity="0.6"/>
  <text x="300" y="53" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#F3E8FF" text-anchor="middle" letter-spacing="2">
    MINIMALIST FINE-LINE
  </text>

  <text x="300" y="105" font-family="'Cinzel', Georgia, serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    Roman Numeral Date
  </text>
  <text x="300" y="130" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Precision Single-Needle Wrist Artwork
  </text>

  <!-- Roman Numeral Artwork Display Box -->
  <g transform="translate(100, 160)">
    <rect width="400" height="150" rx="16" fill="#0B0E14" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Delicate Crosshairs -->
    <line x1="200" y1="20" x2="200" y2="40" stroke="#C084FC" stroke-width="1" opacity="0.5"/>
    <line x1="200" y1="110" x2="200" y2="130" stroke="#C084FC" stroke-width="1" opacity="0.5"/>

    <!-- Roman Numerals Text Artwork -->
    <text x="200" y="88" font-family="'Times New Roman', Georgia, serif" font-size="44" font-weight="400" fill="#F8FAFC" letter-spacing="12" text-anchor="middle">
      MCMLXXXXVI
    </text>

    <!-- Subtitle Line -->
    <text x="200" y="122" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#A855F7" letter-spacing="3" text-anchor="middle">
      • XI • XII • MMXXVI •
    </text>
  </g>

  <text x="300" y="372" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">
    TATTOO FONTLAB • FAMOUS DESIGNS ARCHIVE
  </text>
</svg>