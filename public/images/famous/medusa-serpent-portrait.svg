<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-medusa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0810"/>
      <stop offset="50%" stop-color="#1A1226"/>
      <stop offset="100%" stop-color="#08050D"/>
    </linearGradient>
    <radialGradient id="glow-medusa" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg-medusa)"/>
  <circle cx="300" cy="200" r="230" fill="url(#glow-medusa)"/>

  <rect x="20" y="20" width="560" height="360" rx="16" fill="none" stroke="#C084FC" stroke-opacity="0.3" stroke-width="2"/>

  <rect x="180" y="32" width="240" height="26" rx="13" fill="#581C87" stroke="#C084FC" stroke-opacity="0.6"/>
  <text x="300" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#F3E8FF" text-anchor="middle" letter-spacing="2">
    MYTHOLOGICAL PORTRAIT
  </text>

  <text x="300" y="98" font-family="Georgia, serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    Medusa Serpent Portrait
  </text>
  <text x="300" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Empowerment, Shield &amp; Resilience Motif
  </text>

  <!-- Medusa Graphic Silhouette -->
  <g transform="translate(300, 240)">
    <!-- Writhing Snakes Hair Lines -->
    <path d="M 0 -80 C -40 -120 -80 -80 -50 -50 C -30 -30 -60 -10 -80 -30" fill="none" stroke="#A855F7" stroke-width="4" stroke-linecap="round"/>
    <path d="M 0 -80 C 40 -120 80 -80 50 -50 C 30 -30 60 -10 80 -30" fill="none" stroke="#A855F7" stroke-width="4" stroke-linecap="round"/>
    <path d="M -20 -90 C -60 -100 -70 -50 -40 -30" fill="none" stroke="#C084FC" stroke-width="3" stroke-linecap="round"/>
    <path d="M 20 -90 C 60 -100 70 -50 40 -30" fill="none" stroke="#C084FC" stroke-width="3" stroke-linecap="round"/>

    <!-- Female Face Profile Silhouette -->
    <ellipse cx="0" cy="-25" rx="30" ry="40" fill="#0B0E14" stroke="#F3E8FF" stroke-width="2"/>
    <!-- Closed Serene Eyes -->
    <path d="M -15 -30 Q -10 -25 -5 -30" fill="none" stroke="#C084FC" stroke-width="2"/>
    <path d="M 5 -30 Q 10 -25 15 -30" fill="none" stroke="#C084FC" stroke-width="2"/>
    <!-- Lips -->
    <path d="M -8 -10 Q 0 -5 8 -10" fill="none" stroke="#E9D5FF" stroke-width="2"/>
  </g>

  <text x="300" y="372" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">
    TATTOO FONTLAB • FAMOUS DESIGNS ARCHIVE
  </text>
</svg>