<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-ouro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090E"/>
      <stop offset="50%" stop-color="#101726"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <radialGradient id="glow-ouro" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg-ouro)"/>
  <circle cx="300" cy="200" r="230" fill="url(#glow-ouro)"/>

  <rect x="20" y="20" width="560" height="360" rx="16" fill="none" stroke="#10B981" stroke-opacity="0.3" stroke-width="2"/>

  <rect x="180" y="32" width="240" height="26" rx="13" fill="#064E3B" stroke="#10B981" stroke-opacity="0.6"/>
  <text x="300" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#D1FAE5" text-anchor="middle" letter-spacing="2">
    ANCIENT ALCHEMY SYMBOL
  </text>

  <text x="300" y="98" font-family="Georgia, serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    Ouroboros Snake Eternity
  </text>
  <text x="300" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Eternal Life, Death &amp; Rebirth Cycle
  </text>

  <!-- Ouroboros Circle Graphic -->
  <g transform="translate(300, 240)">
    <!-- Main Circular Body -->
    <circle cx="0" cy="-20" r="70" fill="none" stroke="#059669" stroke-width="18"/>
    <circle cx="0" cy="-20" r="70" fill="none" stroke="#34D399" stroke-width="4" stroke-dasharray="6 4"/>

    <!-- Snake Head Eating Tail -->
    <path d="M -10 -88 C -5 -98 5 -98 10 -88 L 0 -70 Z" fill="#047857" stroke="#A7F3D0" stroke-width="1.5"/>
    <circle cx="-4" cy="-84" r="1.5" fill="#FACC15"/>
    <circle cx="4" cy="-84" r="1.5" fill="#FACC15"/>

    <!-- Inner Geometry Triangle -->
    <polygon points="0,-70 43,-5 -43,-5" fill="none" stroke="#A7F3D0" stroke-width="1" opacity="0.4"/>
  </g>

  <text x="300" y="372" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">
    TATTOO FONTLAB • FAMOUS DESIGNS ARCHIVE
  </text>
</svg>