<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-koi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0C1329"/>
      <stop offset="100%" stop-color="#04060E"/>
    </linearGradient>
    <radialGradient id="water-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="koi-scales" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg-koi)"/>
  <circle cx="300" cy="200" r="230" fill="url(#water-glow)"/>

  <!-- Border Frame -->
  <rect x="18" y="18" width="564" height="364" rx="16" fill="none" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Style Tag -->
  <rect x="200" y="32" width="200" height="26" rx="13" fill="#0369A1" stroke="#38BDF8" stroke-opacity="0.6"/>
  <text x="300" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#E0F2FE" text-anchor="middle" letter-spacing="2">
    JAPANESE IREZUMI ART
  </text>

  <!-- Title -->
  <text x="300" y="98" font-family="Georgia, serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    Ascending Koi &amp; Waves
  </text>
  <text x="300" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Traditional Irezumi Dragon Gate Legend
  </text>

  <!-- Visual Artwork Graphic -->
  <g transform="translate(180, 140)">
    <!-- Water Waves Background -->
    <path d="M 10 140 Q 60 90 120 130 T 230 110 T 280 150" fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M -10 170 Q 50 120 130 160 T 240 140 T 290 180" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- Sakura Petals -->
    <path d="M 40 40 C 35 25 50 20 60 30 C 70 20 85 25 80 40 C 75 55 60 65 60 65 C 60 65 45 55 40 40 Z" fill="#F472B6" opacity="0.8"/>
    <path d="M 210 50 C 205 35 220 30 230 40 C 240 30 255 35 250 50 C 245 65 230 75 230 75 C 230 75 215 65 210 50 Z" fill="#F472B6" opacity="0.7"/>

    <!-- Main Ascending Koi Fish Silhouette -->
    <path d="M 120 180 C 80 140 70 80 110 30 C 130 5 160 5 175 30 C 205 80 195 140 155 180 Z" fill="url(#koi-scales)" stroke="#FEE2E2" stroke-width="2"/>

    <!-- Koi Fins -->
    <path d="M 85 90 C 50 80 40 110 75 120 Z" fill="#EF4444" opacity="0.9"/>
    <path d="M 195 90 C 230 80 240 110 205 120 Z" fill="#EF4444" opacity="0.9"/>
    <path d="M 120 180 Q 140 220 100 235 Q 140 200 155 180" fill="#DC2626"/>

    <!-- Fish Scales Pattern -->
    <circle cx="125" cy="70" r="10" fill="none" stroke="#FEF08A" stroke-width="1.5" opacity="0.7"/>
    <circle cx="145" cy="70" r="10" fill="none" stroke="#FEF08A" stroke-width="1.5" opacity="0.7"/>
    <circle cx="135" cy="95" r="12" fill="none" stroke="#FEF08A" stroke-width="1.5" opacity="0.7"/>
    <circle cx="155" cy="95" r="12" fill="none" stroke="#FEF08A" stroke-width="1.5" opacity="0.7"/>
    <circle cx="130" cy="125" r="12" fill="none" stroke="#FEF08A" stroke-width="1.5" opacity="0.6"/>

    <!-- Eyes and Barbels -->
    <circle cx="130" cy="35" r="4" fill="#FFFFFF"/>
    <circle cx="130" cy="35" r="2" fill="#000000"/>
    <path d="M 140 20 Q 155 10 165 18" fill="none" stroke="#FEF08A" stroke-width="2"/>
  </g>

  <!-- Footer -->
  <text x="300" y="372" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">
    TATTOO FONTLAB • FAMOUS DESIGNS ARCHIVE
  </text>
</svg>