<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-lotus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070D"/>
      <stop offset="50%" stop-color="#171124"/>
      <stop offset="100%" stop-color="#07060A"/>
    </linearGradient>
    <radialGradient id="glow-lotus" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg-lotus)"/>
  <circle cx="300" cy="200" r="230" fill="url(#glow-lotus)"/>

  <rect x="20" y="20" width="560" height="360" rx="16" fill="none" stroke="#F472B6" stroke-opacity="0.3" stroke-width="2"/>

  <rect x="180" y="32" width="240" height="26" rx="13" fill="#831843" stroke="#F472B6" stroke-opacity="0.6"/>
  <text x="300" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FCE7F3" text-anchor="middle" letter-spacing="2">
    SACRED GEOMETRY MANDALA
  </text>

  <text x="300" y="98" font-family="Georgia, serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    Lotus Bloom &amp; Unalome
  </text>
  <text x="300" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Spiritual Awakening &amp; Enlightenment Spiral
  </text>

  <!-- Lotus & Unalome Mandala Graphic -->
  <g transform="translate(300, 240)">
    <!-- Unalome Spiral Line -->
    <path d="M 0 90 L 0 50 C -20 40 -20 20 0 20 C 20 20 20 35 0 35 C -10 35 -10 25 0 25 L 0 -20" fill="none" stroke="#F472B6" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Lotus Bloom Petals -->
    <!-- Center Petal -->
    <path d="M 0 -20 C -25 -60 0 -95 0 -95 C 0 -95 25 -60 0 -20 Z" fill="#F472B6" opacity="0.9" stroke="#FDF2F8" stroke-width="1.5"/>
    <!-- Left Inner Petal -->
    <path d="M 0 -20 C -45 -50 -40 -80 -20 -85 C -15 -60 0 -20 0 -20 Z" fill="#EC4899" opacity="0.8"/>
    <!-- Right Inner Petal -->
    <path d="M 0 -20 C 45 -50 40 -80 20 -85 C 15 -60 0 -20 0 -20 Z" fill="#EC4899" opacity="0.8"/>
    <!-- Outer Left Petal -->
    <path d="M 0 -20 C -70 -35 -65 -60 -45 -65 C -30 -45 0 -20 0 -20 Z" fill="#DB2777" opacity="0.7"/>
    <!-- Outer Right Petal -->
    <path d="M 0 -20 C 70 -35 65 -60 45 -65 C 30 -45 0 -20 0 -20 Z" fill="#DB2777" opacity="0.7"/>

    <!-- Geometric Dots (Stippling) -->
    <circle cx="0" cy="-105" r="3" fill="#FDF2F8"/>
    <circle cx="0" cy="-115" r="2" fill="#FDF2F8"/>
    <circle cx="0" cy="-123" r="1.5" fill="#FDF2F8"/>
  </g>

  <text x="300" y="372" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">
    TATTOO FONTLAB • FAMOUS DESIGNS ARCHIVE
  </text>
</svg>