<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0C10" />
      <stop offset="100%" stop-color="#141822" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" />
  <circle cx="300" cy="200" r="220" fill="url(#glow)" />

  <!-- Blackwork Ornamentation -->
  <g transform="translate(300, 180)" fill="#0B0E14" stroke="#A855F7" stroke-width="2">
    <!-- Mandala Rays -->
    <path d="M 0 -120 L 25 -60 L 0 -40 L -25 -60 Z" fill="#000000" stroke="#C084FC" stroke-width="3" />
    <path d="M 0 120 L 25 60 L 0 40 L -25 60 Z" fill="#000000" stroke="#C084FC" stroke-width="3" />
    <path d="M -120 0 L -60 25 L -40 0 L -60 -25 Z" fill="#000000" stroke="#C084FC" stroke-width="3" />
    <path d="M 120 0 L 60 25 L 40 0 L 60 -25 Z" fill="#000000" stroke="#C084FC" stroke-width="3" />

    <!-- Solid Heavy Black Polygon Rings -->
    <circle r="90" fill="none" stroke="#000000" stroke-width="24" />
    <circle r="90" fill="none" stroke="#C084FC" stroke-width="2" />
    <circle r="50" fill="#000000" stroke="#E9D5FF" stroke-width="3" />
    
    <!-- Negative Space Geometry -->
    <polygon points="0,-35 30,20 -30,20" fill="#A855F7" />
    <polygon points="0,35 30,-20 -30,-20" fill="#000000" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Style Label Banner -->
  <rect x="40" y="320" width="520" height="50" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  <text x="60" y="352" font-family="sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="1">BLACKWORK TATTOO</text>
  <text x="520" y="351" font-family="sans-serif" font-weight="700" font-size="12" fill="#A855F7" text-anchor="end">BOLD GRAPHIC FILL</text>
</svg>
