<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0A0B12" />
  
  <!-- Japanese Wave & Sun Background -->
  <circle cx="300" cy="150" r="80" fill="#DC2626" opacity="0.85" />
  
  <!-- Waves -->
  <path d="M 100 230 C 180 170, 240 250, 300 210 C 360 170, 420 250, 500 200 L 500 300 L 100 300 Z" fill="#1E293B" stroke="#000000" stroke-width="4" />
  <path d="M 120 250 C 200 200, 260 270, 320 230 C 380 190, 440 270, 480 230 L 480 300 L 120 300 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />

  <!-- Japanese Kanji Calligraphy overlay -->
  <text x="300" y="175" font-family="'Noto Serif JP', 'Ma Shan Zheng', serif" font-weight="900" font-size="70" fill="#FFFFFF" text-anchor="middle">永遠</text>

  <!-- Style Label Banner -->
  <rect x="40" y="320" width="520" height="50" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  <text x="60" y="352" font-family="sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="1">JAPANESE IREZUMI</text>
  <text x="520" y="351" font-family="sans-serif" font-weight="700" font-size="12" fill="#F43F5E" text-anchor="end">KANJI & WAVE COMPOSITION</text>
</svg>
