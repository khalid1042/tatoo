<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#07090E" />
  
  <!-- Gothic Arch Background -->
  <path d="M 180 300 L 180 140 C 180 60, 420 60, 420 140 L 420 300 Z" fill="none" stroke="#334155" stroke-width="3" />
  <path d="M 200 300 L 200 145 C 200 80, 400 80, 400 145 L 400 300 Z" fill="none" stroke="#7E22CE" stroke-width="2" />

  <!-- Dark Architectural Drop Cap Ornamental Cross -->
  <g transform="translate(300, 140)" fill="#A855F7" stroke="#000000" stroke-width="2">
    <path d="M -15 -60 L 15 -60 L 15 -15 L 60 -15 L 60 15 L 15 15 L 15 70 L -15 70 L -15 15 L -60 15 L -60 -15 L -15 -15 Z" />
    <circle cx="0" cy="0" r="10" fill="#000000" stroke="#E9D5FF" stroke-width="2" />
  </g>

  <!-- Gothic Lettering Text -->
  <text x="300" y="260" font-family="'UnifrakturMaguntia', 'Pirata One', serif" font-weight="900" font-size="64" fill="#F3E8FF" text-anchor="middle" letter-spacing="6">KHALID</text>

  <!-- Style Label Banner -->
  <rect x="40" y="320" width="520" height="50" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  <text x="60" y="352" font-family="sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="1">GOTHIC TATTOO</text>
  <text x="520" y="351" font-family="sans-serif" font-weight="700" font-size="12" fill="#A855F7" text-anchor="end">DARK & DRAMATIC</text>
</svg>
