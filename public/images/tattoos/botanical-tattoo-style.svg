<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#090B10" />
  
  <!-- Rose Blossom Line Art -->
  <g transform="translate(300, 140)" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round">
    <path d="M 0 -40 C -30 -30, -30 10, 0 30 C 30 10, 30 -30, 0 -40 Z" fill="#065F46" />
    <path d="M -10 -20 C -5 -35, 5 -35, 10 -20" />
    <path d="M 0 30 C 0 90, -40 110, -80 120" stroke-width="2.5" />
    <!-- Leaf -->
    <path d="M -20 60 C -60 40, -50 70, -20 60 Z" fill="#047857" />
  </g>

  <!-- Botanical Script Text -->
  <text x="300" y="270" font-family="'Great Vibes', cursive" font-size="52" fill="#F8FAFC" text-anchor="middle">Wildflower</text>

  <!-- Style Label Banner -->
  <rect x="40" y="320" width="520" height="50" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  <text x="60" y="352" font-family="sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="1">BOTANICAL TATTOO</text>
  <text x="520" y="351" font-family="sans-serif" font-weight="700" font-size="12" fill="#34D399" text-anchor="end">FLORAL & LEAF ARTWORK</text>
</svg>
