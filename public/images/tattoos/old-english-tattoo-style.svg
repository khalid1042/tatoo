<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#090B10" />
  
  <!-- Old English Spur Crest Geometry -->
  <g transform="translate(300, 150)" fill="#000000" stroke="#EAB308" stroke-width="2">
    <polygon points="0,-70 50,0 0,70 -50,0" />
    <polygon points="0,-50 35,0 0,50 -35,0" fill="#1E293B" />
  </g>

  <!-- Old English Text Banner -->
  <text x="300" y="250" font-family="'UnifrakturMaguntia', 'Chivo', serif" font-weight="900" font-size="52" fill="#FEF08A" text-anchor="middle" letter-spacing="4">FAMILY FIRST</text>

  <!-- Style Label Banner -->
  <rect x="40" y="320" width="520" height="50" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  <text x="60" y="352" font-family="sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="1">OLD ENGLISH TATTOO</text>
  <text x="520" y="351" font-family="sans-serif" font-weight="700" font-size="12" fill="#EAB308" text-anchor="end">CLASSIC BLACKLETTER</text>
</svg>
