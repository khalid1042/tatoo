<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradFine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#181926" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bgGradFine)" />
  
  <!-- Fine Line Botanical Branches -->
  <g transform="translate(300, 175)" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Curving Stem -->
    <path d="M -140 40 C -80 -60, 40 -90, 140 -20" stroke="#C084FC" stroke-width="2" />
    
    <!-- Leaves -->
    <path d="M -100 10 C -90 -20, -60 -20, -70 5" />
    <path d="M -60 -25 C -50 -55, -20 -50, -35 -20" />
    <path d="M -10 -48 C 10 -75, 40 -70, 20 -40" />
    <path d="M 45 -52 C 70 -75, 95 -65, 75 -40" />
    <path d="M 95 -38 C 120 -55, 135 -40, 120 -20" />

    <!-- Delicate Micro Stars -->
    <circle cx="-110" cy="-30" r="1.5" fill="#E2E8F0" />
    <circle cx="130" cy="-60" r="1.5" fill="#E2E8F0" />
    <circle cx="0" cy="-90" r="2" fill="#A855F7" />
  </g>

  <!-- Fine Script Overlay -->
  <text x="300" y="245" font-family="'Great Vibes', 'Alex Brush', cursive, sans-serif" font-size="46" fill="#F8FAFC" text-anchor="middle">Serendipity</text>

  <!-- Style Label Banner -->
  <rect x="40" y="320" width="520" height="50" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  <text x="60" y="352" font-family="sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="1">FINE LINE TATTOO</text>
  <text x="520" y="351" font-family="sans-serif" font-weight="700" font-size="12" fill="#C084FC" text-anchor="end">SINGLE NEEDLE PRECISION</text>
</svg>
