<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0D0F17" />
  
  <!-- Traditional Anchor Motif with Heavy Black Outlines -->
  <g transform="translate(300, 160)" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Anchor Ring & Shaft -->
    <circle cx="0" cy="-80" r="16" fill="#DC2626" />
    <rect x="-10" y="-64" width="20" height="110" fill="#EAB308" />
    <rect x="-50" y="-45" width="100" height="16" fill="#EAB308" />

    <!-- Anchor Flukes -->
    <path d="M -90 10 C -90 90, 90 90, 90 10 L 70 10 C 70 65, -70 65, -70 10 Z" fill="#2563EB" />
    <polygon points="-90,10 -110,-5 -80,-5" fill="#DC2626" />
    <polygon points="90,10 110,-5 80,-5" fill="#DC2626" />
  </g>

  <!-- Traditional Banner Ribbon -->
  <g transform="translate(300, 240)">
    <path d="M -160 0 Q 0 30 160 0 L 140 45 Q 0 75 -140 45 Z" fill="#FEF08A" stroke="#000000" stroke-width="5" />
    <text x="0" y="34" font-family="'UnifrakturMaguntia', 'Cinzel', serif" font-weight="900" font-size="28" fill="#000000" text-anchor="middle" letter-spacing="3">HOLD FAST</text>
  </g>

  <!-- Style Label Banner -->
  <rect x="40" y="320" width="520" height="50" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  <text x="60" y="352" font-family="sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="1">TRADITIONAL TATTOO</text>
  <text x="520" y="351" font-family="sans-serif" font-weight="700" font-size="12" fill="#EAB308" text-anchor="end">BOLD OUTLINES & VIBRANT</text>
</svg>
