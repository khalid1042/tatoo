<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0C0E14" />
  
  <!-- Chicano Long Cursive Swashes -->
  <g transform="translate(300, 160)" fill="none" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round">
    <path d="M -220 30 C -150 90, 150 -90, 220 30" />
    <path d="M -180 50 C -100 110, 100 -70, 180 50" stroke="#C084FC" stroke-width="1.5" />
  </g>

  <!-- Chicano Script Text -->
  <text x="300" y="170" font-family="'Great Vibes', 'Allura', cursive" font-size="78" fill="#F8FAFC" text-anchor="middle">Bendecida</text>

  <!-- Style Label Banner -->
  <rect x="40" y="320" width="520" height="50" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  <text x="60" y="352" font-family="sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="1">CHICANO LETTERING</text>
  <text x="520" y="351" font-family="sans-serif" font-weight="700" font-size="12" fill="#C084FC" text-anchor="end">EXTENDED SWASH SCRIPT</text>
</svg>
