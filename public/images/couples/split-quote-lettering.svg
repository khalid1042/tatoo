  </text>

  <g transform="translate(60, 160)">
    <rect width="480" height="150" rx="16" fill="#0B0E14" stroke="#334155" stroke-width="1.5"/>
    <text x="240" y="70" font-family="'Great Vibes', cursive" font-size="32" fill="#C084FC" text-anchor="middle">
      Partner 1: "To Infinity..."
    </text>
    <text x="240" y="115" font-family="'Great Vibes', cursive" font-size="32" fill="#E9D5FF" text-anchor="middle">
      Partner 2: "...And Beyond"
    </text>
  </g>

  <text x="300" y="372" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">
    TATTOO FONTLAB • COUPLE TATTOOS HUB
  </text>
