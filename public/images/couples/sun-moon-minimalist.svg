<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-c-sm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0812"/>
      <stop offset="50%" stop-color="#1A1226"/>
      <stop offset="100%" stop-color="#08050E"/>
    </linearGradient>
    <radialGradient id="glow-c-sm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg-c-sm)"/>
  <circle cx="300" cy="200" r="220" fill="url(#glow-c-sm)"/>

  <rect x="20" y="20" width="560" height="360" rx="16" fill="none" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="2"/>

  <rect x="180" y="32" width="240" height="26" rx="13" fill="#78350F" stroke="#F59E0B" stroke-opacity="0.6"/>
  <text x="300" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FEF3C7" text-anchor="middle" letter-spacing="2">
    COMPLEMENTARY COUPLE TATTOO
  </text>

  <text x="300" y="98" font-family="Georgia, serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    Sun &amp; Crescent Moon
  </text>
  <text x="300" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Opposite Energies forming a Complete Whole
  </text>

  <!-- Sun & Moon Graphics -->
  <g transform="translate(180, 230)">
    <!-- Partner 1: Sun -->
    <circle cx="0" cy="0" r="30" fill="#F59E0B" opacity="0.8"/>
    <path d="M 0 -45 L 0 -35 M 0 45 L 0 35 M -45 0 L -35 0 M 45 0 L 35 0" stroke="#F59E0B" stroke-width="3"/>
    <text x="0" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle">Partner 1</text>
  </g>

  <g transform="translate(420, 230)">
    <!-- Partner 2: Moon -->
    <path d="M -25 -25 A 30 30 0 1 0 25 25 A 25 25 0 1 1 -25 -25 Z" fill="#C084FC"/>
    <text x="0" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle">Partner 2</text>
  </g>

  <text x="300" y="372" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">
    TATTOO FONTLAB • COUPLE TATTOOS HUB
  </text>
</svg>
