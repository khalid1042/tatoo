<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-c-lk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070B"/>
      <stop offset="50%" stop-color="#181222"/>
      <stop offset="100%" stop-color="#060509"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg-c-lk)"/>
  <rect x="20" y="20" width="560" height="360" rx="16" fill="none" stroke="#EC4899" stroke-opacity="0.3" stroke-width="2"/>

  <rect x="180" y="32" width="240" height="26" rx="13" fill="#831843" stroke="#EC4899" stroke-opacity="0.6"/>
  <text x="300" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FCE7F3" text-anchor="middle" letter-spacing="2">
    CONNECTED COUPLE CONCEPT
  </text>

  <text x="300" y="98" font-family="Georgia, serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    Lock &amp; Skeleton Key
  </text>
  <text x="300" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Mutual Trust &amp; Holding the Key to One's Heart
  </text>

  <!-- Lock & Key Graphic -->
  <g transform="translate(200, 230)">
    <!-- Heart Padlock -->
    <path d="M 0 -20 A 15 15 0 0 0 -30 0 C -30 20 0 35 0 35 C 0 35 30 20 30 0 A 15 15 0 0 0 0 -20 Z" fill="#F43F5E"/>
    <circle cx="0" cy="-25" r="12" fill="none" stroke="#F43F5E" stroke-width="4"/>
  </g>

  <g transform="translate(400, 230)">
    <!-- Skeleton Key -->
    <circle cx="0" cy="-20" r="14" fill="none" stroke="#F43F5E" stroke-width="4"/>
    <line x1="0" y1="-6" x2="0" y2="40" stroke="#F43F5E" stroke-width="4"/>
    <line x1="0" y1="25" x2="12" y2="25" stroke="#F43F5E" stroke-width="4"/>
  </g>

  <text x="300" y="372" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">
    TATTOO FONTLAB • COUPLE TATTOOS HUB
  </text>
</svg>
