<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-chic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070A"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>
    <radialGradient id="glow-chic" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg-chic)"/>
  <circle cx="300" cy="200" r="220" fill="url(#glow-chic)"/>

  <rect x="20" y="20" width="560" height="360" rx="16" fill="none" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="2"/>

  <rect x="180" y="32" width="240" height="26" rx="13" fill="#0C4A6E" stroke="#38BDF8" stroke-opacity="0.6"/>
  <text x="300" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#E0F2FE" text-anchor="middle" letter-spacing="2">
    CHICANO FINE LINE SCRIPT
  </text>

  <text x="300" y="98" font-family="Georgia, serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    Family Loyalty
  </text>
  <text x="300" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Sweeping Calligraphy &amp; Drop Shadows
  </text>

  <!-- Script Graphic Box -->
  <g transform="translate(60, 160)">
    <rect width="480" height="150" rx="16" fill="#0B0E14" stroke="#334155" stroke-width="1.5"/>

    <text x="240" y="92" font-family="'Great Vibes', 'Brush Script MT', cursive" font-size="52" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="2">
      Family Loyalty
    </text>

    <path d="M 120 115 C 180 130 300 130 360 115" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="300" y="372" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">
    TATTOO FONTLAB • BEAUTIFUL TATTOOS HUB
  </text>
</svg>
