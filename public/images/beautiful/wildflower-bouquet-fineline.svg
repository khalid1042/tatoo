<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-wild" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B10"/>
      <stop offset="50%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#07090D"/>
    </linearGradient>
    <radialGradient id="glow-wild" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg-wild)"/>
  <circle cx="300" cy="200" r="220" fill="url(#glow-wild)"/>

  <rect x="20" y="20" width="560" height="360" rx="16" fill="none" stroke="#F472B6" stroke-opacity="0.3" stroke-width="2"/>

  <rect x="180" y="32" width="240" height="26" rx="13" fill="#831843" stroke="#F472B6" stroke-opacity="0.6"/>
  <text x="300" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FCE7F3" text-anchor="middle" letter-spacing="2">
    DELICATE FINE LINE BOTANICAL
  </text>

  <text x="300" y="98" font-family="Georgia, serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    Wildflower Bouquet
  </text>
  <text x="300" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Lavender, Chamomile &amp; Stems Artwork
  </text>

  <!-- Wildflower Graphic -->
  <g transform="translate(300, 240)">
    <!-- Stems -->
    <path d="M 0 100 Q -10 20 -30 -60" fill="none" stroke="#F472B6" stroke-width="2" stroke-linecap="round"/>
    <path d="M 0 100 Q 0 10 0 -80" fill="none" stroke="#F472B6" stroke-width="2" stroke-linecap="round"/>
    <path d="M 0 100 Q 10 20 30 -60" fill="none" stroke="#F472B6" stroke-width="2" stroke-linecap="round"/>

    <!-- Flowers -->
    <!-- Center Lavender Stem Buds -->
    <circle cx="0" cy="-80" r="4" fill="#E879F9"/>
    <circle cx="-5" cy="-70" r="3.5" fill="#E879F9"/>
    <circle cx="5" cy="-70" r="3.5" fill="#E879F9"/>
    <circle cx="-6" cy="-60" r="3" fill="#E879F9"/>
    <circle cx="6" cy="-60" r="3" fill="#E879F9"/>

    <!-- Left Daisy -->
    <circle cx="-30" cy="-60" r="6" fill="#FACC15"/>
    <circle cx="-42" cy="-60" r="4" fill="#FFFFFF"/>
    <circle cx="-18" cy="-60" r="4" fill="#FFFFFF"/>
    <circle cx="-30" cy="-72" r="4" fill="#FFFFFF"/>
    <circle cx="-30" cy="-48" r="4" fill="#FFFFFF"/>

    <!-- Right Wild Rose -->
    <circle cx="30" cy="-60" r="5" fill="#F43F5E"/>
    <circle cx="20" cy="-60" r="4" fill="#FB7185"/>
    <circle cx="40" cy="-60" r="4" fill="#FB7185"/>
    <circle cx="30" cy="-70" r="4" fill="#FB7185"/>
    <circle cx="30" cy="-50" r="4" fill="#FB7185"/>
  </g>

  <text x="300" y="372" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">
    TATTOO FONTLAB • BEAUTIFUL TATTOOS HUB
  </text>
</svg>
