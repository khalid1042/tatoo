      <stop offset="0%" stop-color="#070707"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg-bw)"/>
  <rect x="20" y="20" width="560" height="360" rx="16" fill="none" stroke="#52525B" stroke-width="2"/>

  <rect x="180" y="32" width="240" height="26" rx="13" fill="#27272A" stroke="#71717A" stroke-width="1.5"/>
  <text x="300" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#F4F4F5" text-anchor="middle" letter-spacing="2">
