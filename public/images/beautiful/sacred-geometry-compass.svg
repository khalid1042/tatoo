<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-geo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090D"/>
      <stop offset="50%" stop-color="#111726"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>
    <radialGradient id="glow-geo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg-geo)"/>
  <circle cx="300" cy="200" r="220" fill="url(#glow-geo)"/>

  <rect x="20" y="20" width="560" height="360" rx="16" fill="none" stroke="#818CF8" stroke-opacity="0.3" stroke-width="2"/>

  <rect x="180" y="32" width="240" height="26" rx="13" fill="#312E81" stroke="#818CF8" stroke-opacity="0.6"/>
  <text x="300" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#EEF2FF" text-anchor="middle" letter-spacing="2">
    SACRED GEOMETRY MANDALA
  </text>

  <text x="300" y="98" font-family="Georgia, serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    Geometric Sun &amp; Compass
  </text>
  <text x="300" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Internal Light &amp; Directional Guidance
  </text>

  <!-- Compass Graphic -->
  <g transform="translate(300, 230)">
    <circle cx="0" cy="0" r="65" fill="none" stroke="#818CF8" stroke-width="2"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#818CF8" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#C7D2FE" stroke-width="1.5"/>

    <!-- Compass Star Points -->
    <polygon points="0,-75 10,-30 0,-20 -10,-30" fill="#818CF8"/>
    <polygon points="0,75 10,30 0,20 -10,30" fill="#818CF8"/>
    <polygon points="-75,0 -30,10 -20,0 -30,-10" fill="#818CF8"/>
    <polygon points="75,0 30,10 20,0 30,-10" fill="#818CF8"/>

    <!-- Diagonal Arrow Lines -->
    <line x1="-50" y1="-50" x2="50" y2="50" stroke="#C7D2FE" stroke-width="1"/>
    <line x1="50" y1="-50" x2="-50" y2="50" stroke="#C7D2FE" stroke-width="1"/>
  </g>

  <text x="300" y="372" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">
    TATTOO FONTLAB • BEAUTIFUL TATTOOS HUB
  </text>
</svg>
