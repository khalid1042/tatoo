<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-mnt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090E"/>
      <stop offset="50%" stop-color="#101826"/>
      <stop offset="100%" stop-color="#04060A"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg-mnt)"/>
  <rect x="20" y="20" width="560" height="360" rx="16" fill="none" stroke="#10B981" stroke-opacity="0.3" stroke-width="2"/>

  <rect x="180" y="32" width="240" height="26" rx="13" fill="#064E3B" stroke="#10B981" stroke-opacity="0.6"/>
  <text x="300" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#D1FAE5" text-anchor="middle" letter-spacing="2">
    MINIMALIST NATURE BAND
  </text>

  <text x="300" y="98" font-family="Georgia, serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    Mountain Range &amp; Pine Forest
  </text>
  <text x="300" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Endurance, Stability &amp; Wilderness Adventure
  </text>

  <g transform="translate(300, 230)">
    <!-- Mountain Peaks -->
    <polygon points="-80,40 0,-40 80,40" fill="none" stroke="#10B981" stroke-width="3"/>
    <polygon points="-30,40 30,-20 90,40" fill="none" stroke="#34D399" stroke-width="2"/>
  </g>

  <text x="300" y="372" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">
    TATTOO FONTLAB • BEAUTIFUL TATTOOS HUB
  </text>
</svg>
