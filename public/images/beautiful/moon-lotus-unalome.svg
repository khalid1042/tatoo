<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-m-lot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0812"/>
      <stop offset="50%" stop-color="#1B142A"/>
      <stop offset="100%" stop-color="#07050E"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg-m-lot)"/>
  <rect x="20" y="20" width="560" height="360" rx="16" fill="none" stroke="#F472B6" stroke-opacity="0.3" stroke-width="2"/>

  <rect x="180" y="32" width="240" height="26" rx="13" fill="#831843" stroke="#F472B6" stroke-opacity="0.6"/>
  <text x="300" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FCE7F3" text-anchor="middle" letter-spacing="2">
    CELESTIAL STERNUM PIECE
  </text>

  <text x="300" y="98" font-family="Georgia, serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    Moon &amp; Lotus Unalome
  </text>
  <text x="300" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Intuition &amp; Spiritual Awakening
  </text>

  <g transform="translate(300, 230)">
    <!-- Crescent Moon -->
    <path d="M -50 -40 A 50 50 0 1 0 50 -40 A 40 40 0 1 1 -50 -40 Z" fill="#F472B6" opacity="0.8"/>
    <!-- Lotus Bloom -->
    <path d="M 0 -20 C -25 -60 0 -90 0 -90 C 0 -90 25 -60 0 -20 Z" fill="#FCE7F3" stroke="#F472B6" stroke-width="1.5"/>
  </g>

  <text x="300" y="372" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">
    TATTOO FONTLAB • BEAUTIFUL TATTOOS HUB
  </text>
</svg>
