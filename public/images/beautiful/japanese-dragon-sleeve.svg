<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-drag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070A"/>
      <stop offset="50%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg-drag)"/>
  <rect x="20" y="20" width="560" height="360" rx="16" fill="none" stroke="#60A5FA" stroke-opacity="0.3" stroke-width="2"/>

  <rect x="180" y="32" width="240" height="26" rx="13" fill="#1E3A8A" stroke="#60A5FA" stroke-opacity="0.6"/>
  <text x="300" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#DBEAFE" text-anchor="middle" letter-spacing="2">
    JAPANESE IREZUMI DRAGON
  </text>

  <text x="300" y="98" font-family="Georgia, serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">
